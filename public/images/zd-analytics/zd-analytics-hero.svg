<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="500" fill="#050e24"/>

  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="zda-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f5c249" stroke-width="0.3" opacity="0.06"/>
    </pattern>

    <!-- Background glow -->
    <radialGradient id="zda-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#f5c249" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f5c249" stop-opacity="0"/>
    </radialGradient>

    <!-- Bar gradient (regular) -->
    <linearGradient id="zda-bar-regular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d9a82f" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Bar gradient (highlighted) -->
    <linearGradient id="zda-bar-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d9a82f"/>
    </linearGradient>

    <!-- Forecast area gradient (past — solid) -->
    <linearGradient id="zda-past-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5c249" stop-opacity="0"/>
    </linearGradient>

    <!-- Forecast confidence band -->
    <linearGradient id="zda-forecast-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#zda-grid)"/>
  <ellipse cx="400" cy="250" rx="380" ry="240" fill="url(#zda-glow)"/>

  <!-- ============ BROWSER FRAME ============ -->
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#0a1630" stroke="#f5c249" stroke-width="1" opacity="0.85"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>

  <!-- Header bar -->
  <rect x="40" y="40" width="720" height="38" rx="14" fill="#050e24" opacity="0.7"/>
  <rect x="40" y="76" width="720" height="0.5" fill="#f5c249" opacity="0.2"/>

  <!-- macOS-style window controls -->
  <circle cx="62" cy="59" r="5" fill="#ef4444"/>
  <circle cx="80" cy="59" r="5" fill="#f5c249"/>
  <circle cx="98" cy="59" r="5" fill="#10b981"/>

  <!-- Title -->
  <text x="400" y="63" font-family="sans-serif" font-size="11" font-weight="500" fill="#f5c249" text-anchor="middle" opacity="0.6" letter-spacing="1">ZD ANALYTICS · INSIGHTS</text>

  <!-- AI ACTIVE badge top-right -->
  <g transform="translate(660, 50)">
    <rect width="80" height="20" rx="10" fill="#10b981" opacity="0.15"/>
    <rect width="80" height="20" rx="10" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
    <!-- AI icon (sparkle/star) -->
    <g transform="translate(10, 6)" stroke="#10b981" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M 4 0 L 5 3 L 8 4 L 5 5 L 4 8 L 3 5 L 0 4 L 3 3 Z" fill="#10b981" opacity="0.7"/>
    </g>
    <text x="48" y="14" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="middle">AI ACTIVE</text>
    <!-- Subtle pulse -->
    <circle cx="14" cy="10" r="2" fill="#10b981" opacity="0">
      <animate attributeName="r" values="2;9;2" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ TOP: 3 KPI CARDS ============ -->
  <!-- Card 1: Growth Rate -->
  <g transform="translate(70, 100)">
    <rect width="218" height="68" rx="10" fill="#f5c249" opacity="0.04"/>
    <rect width="218" height="68" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Icon badge -->
    <rect x="14" y="14" width="32" height="32" rx="6" fill="#10b981" opacity="0.2"/>
    <g transform="translate(22, 22)" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round">
      <polyline points="0,12 5,7 9,11 16,4"/>
      <polyline points="12,4 16,4 16,8"/>
    </g>

    <!-- Label -->
    <text x="58" y="26" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="1">GROWTH RATE</text>
    <!-- Value -->
    <text x="58" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10b981">+12.4<tspan font-size="14" opacity="0.7">%</tspan></text>
    <!-- Trend indicator -->
    <text x="158" y="50" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" opacity="0.85">↑ 7d</text>
  </g>

  <!-- Card 2: System Health -->
  <g transform="translate(296, 100)">
    <rect width="218" height="68" rx="10" fill="#f5c249" opacity="0.04"/>
    <rect width="218" height="68" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <rect x="14" y="14" width="32" height="32" rx="6" fill="#f5c249" opacity="0.15"/>
    <g transform="translate(22, 22)" stroke="#f5c249" stroke-width="1.5" fill="none">
      <path d="M 8 0 L 0 4 L 0 9 Q 0 14 8 16 Q 16 14 16 9 L 16 4 Z"/>
      <polyline points="5,8 7,10 11,5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="58" y="26" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="1">SYSTEM HEALTH</text>
    <text x="58" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f5c249">99.8<tspan font-size="14" opacity="0.7">%</tspan></text>
    <text x="166" y="50" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.55">optimal</text>
  </g>

  <!-- Card 3: Efficiency -->
  <g transform="translate(522, 100)">
    <rect width="208" height="68" rx="10" fill="#f5c249" opacity="0.04"/>
    <rect width="208" height="68" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <rect x="14" y="14" width="32" height="32" rx="6" fill="#f5c249" opacity="0.15"/>
    <g transform="translate(22, 22)" stroke="#f5c249" stroke-width="1.5" fill="none" stroke-linecap="round">
      <circle cx="8" cy="8" r="6"/>
      <line x1="8" y1="8" x2="12" y2="5"/>
      <line x1="8" y1="8" x2="8" y2="3"/>
    </g>

    <text x="58" y="26" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="1">EFFICIENCY</text>
    <text x="58" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f5c249">87.2<tspan font-size="14" opacity="0.7">%</tspan></text>
    <text x="156" y="50" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981">↑ 5.3%</text>
  </g>

  <!-- ============ MIDDLE LEFT: BAR CHART (Operational Efficiency) ============ -->
  <g transform="translate(70, 188)">
    <rect width="444" height="155" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="444" height="155" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Header -->
    <text x="18" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5c249" opacity="0.85">Operational Efficiency</text>
    <text x="18" y="38" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.45" letter-spacing="0.5">Last 7 days</text>

    <!-- Tabs -->
    <g transform="translate(354, 14)">
      <rect width="36" height="18" rx="4" fill="#f5c249" opacity="0.2"/>
      <text x="18" y="13" font-family="monospace" font-size="8" font-weight="bold" fill="#f5c249" text-anchor="middle">7D</text>
    </g>
    <g transform="translate(394, 14)">
      <rect width="36" height="18" rx="4" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="18" y="13" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" text-anchor="middle">30D</text>
    </g>

    <!-- Y-axis labels -->
    <g font-family="monospace" font-size="7" fill="#f5c249" opacity="0.35">
      <text x="14" y="64" text-anchor="end">100</text>
      <text x="14" y="89" text-anchor="end">75</text>
      <text x="14" y="114" text-anchor="end">50</text>
      <text x="14" y="139" text-anchor="end">25</text>
    </g>

    <!-- Grid lines -->
    <g stroke="#f5c249" stroke-width="0.3" opacity="0.15">
      <line x1="22" y1="62" x2="430" y2="62"/>
      <line x1="22" y1="87" x2="430" y2="87"/>
      <line x1="22" y1="112" x2="430" y2="112"/>
      <line x1="22" y1="137" x2="430" y2="137"/>
    </g>

    <!-- Bars (7 days: M T W T F S S) -->
    <!-- Bar heights vary: highlighted = Thu (max) -->
    <g>
      <!-- Mon -->
      <rect x="40" y="100" width="36" height="42" rx="3" fill="url(#zda-bar-regular)"/>
      <!-- Tue -->
      <rect x="100" y="80" width="36" height="62" rx="3" fill="url(#zda-bar-regular)"/>
      <!-- Wed -->
      <rect x="160" y="70" width="36" height="72" rx="3" fill="url(#zda-bar-regular)"/>
      <!-- Thu (HIGHLIGHTED — peak) -->
      <rect x="220" y="52" width="36" height="90" rx="3" fill="url(#zda-bar-highlight)"/>
      <!-- Peak indicator -->
      <text x="238" y="46" font-family="monospace" font-size="8" font-weight="bold" fill="#fde68a" text-anchor="middle">87.2</text>
      <!-- Fri -->
      <rect x="280" y="66" width="36" height="76" rx="3" fill="url(#zda-bar-regular)"/>
      <!-- Sat -->
      <rect x="340" y="92" width="36" height="50" rx="3" fill="url(#zda-bar-regular)"/>
      <!-- Sun -->
      <rect x="400" y="108" width="30" height="34" rx="3" fill="url(#zda-bar-regular)" opacity="0.75"/>
    </g>

    <!-- X-axis labels -->
    <g font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5">
      <text x="58" y="153" text-anchor="middle">M</text>
      <text x="118" y="153" text-anchor="middle">T</text>
      <text x="178" y="153" text-anchor="middle">W</text>
      <text x="238" y="153" text-anchor="middle" font-weight="bold" fill="#fde68a" opacity="1">T</text>
      <text x="298" y="153" text-anchor="middle">F</text>
      <text x="358" y="153" text-anchor="middle">S</text>
      <text x="415" y="153" text-anchor="middle">S</text>
    </g>
  </g>

  <!-- ============ MIDDLE RIGHT: DONUT CHART (Device Mix) ============ -->
  <g transform="translate(522, 188)">
    <rect width="208" height="155" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="208" height="155" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Header -->
    <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5c249" opacity="0.85">Device Mix</text>
    <text x="192" y="24" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.45" text-anchor="end">247 total</text>

    <!-- Donut chart -->
    <g transform="translate(60, 75)">
      <!-- Background circle (track) -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#f5c249" stroke-width="10" opacity="0.1"/>

      <!-- Camera segment 45% (gold, biggest) — start at top -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#f5c249" stroke-width="10"
              stroke-dasharray="79 176" stroke-dashoffset="0"
              transform="rotate(-90)" opacity="0.95"/>

      <!-- Biometric 32% (green) — after camera -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#10b981" stroke-width="10"
              stroke-dasharray="56 176" stroke-dashoffset="-79"
              transform="rotate(-90)" opacity="0.95"/>

      <!-- Signage 23% (muted gold) -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#d9a82f" stroke-width="10"
              stroke-dasharray="41 176" stroke-dashoffset="-135"
              transform="rotate(-90)" opacity="0.6"/>

      <!-- Center text -->
      <text y="-2" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f5c249" text-anchor="middle">3</text>
      <text y="10" font-family="monospace" font-size="6" fill="#f5c249" opacity="0.55" text-anchor="middle" letter-spacing="0.5">TYPES</text>
    </g>

    <!-- Legend -->
    <g transform="translate(110, 50)">
      <!-- Camera -->
      <rect width="6" height="6" rx="1.5" fill="#f5c249"/>
      <text x="11" y="6" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.8">Camera</text>
      <text x="92" y="6" font-family="monospace" font-size="8" font-weight="bold" fill="#f5c249" text-anchor="end">45%</text>
    </g>
    <g transform="translate(110, 70)">
      <rect width="6" height="6" rx="1.5" fill="#10b981"/>
      <text x="11" y="6" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.8">Biometric</text>
      <text x="92" y="6" font-family="monospace" font-size="8" font-weight="bold" fill="#10b981" text-anchor="end">32%</text>
    </g>
    <g transform="translate(110, 90)">
      <rect width="6" height="6" rx="1.5" fill="#d9a82f" opacity="0.6"/>
      <text x="11" y="6" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.65">Signage</text>
      <text x="92" y="6" font-family="monospace" font-size="8" font-weight="bold" fill="#f5c249" opacity="0.65" text-anchor="end">23%</text>
    </g>

    <!-- Bottom note -->
    <text x="16" y="142" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.45">Distribution by category</text>
  </g>

  <!-- ============ BOTTOM: PREDICTIVE FORECAST ============ -->
  <g transform="translate(70, 360)">
    <rect width="660" height="80" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="660" height="80" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Header -->
    <g>
      <!-- AI sparkle icon -->
      <g transform="translate(16, 14)">
        <path d="M 4 0 L 5 3 L 8 4 L 5 5 L 4 8 L 3 5 L 0 4 L 3 3 Z" fill="#10b981"/>
      </g>
      <text x="32" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f5c249" opacity="0.85">AI Forecast · Next 7 Days</text>
      <text x="158" y="20" font-family="monospace" font-size="8" fill="#10b981" opacity="0.85" font-weight="bold">94.2% confidence</text>
    </g>

    <!-- Right: forecast value -->
    <text x="644" y="20" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.55" text-anchor="end">Projected: +18.7%</text>

    <!-- Chart area -->
    <g transform="translate(0, 30)">
      <!-- Center divider (today marker) -->
      <line x1="330" y1="0" x2="330" y2="42" stroke="#fde68a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5"/>
      <text x="330" y="-2" font-family="monospace" font-size="7" fill="#fde68a" opacity="0.7" text-anchor="middle">TODAY</text>

      <!-- PAST area fill (solid line, gold) -->
      <path d="M 20 30
               C 50 32, 80 22, 110 26
               C 140 30, 170 18, 200 22
               C 230 26, 260 14, 290 18
               C 310 20, 320 22, 330 22
               L 330 42 L 20 42 Z"
            fill="url(#zda-past-fill)"/>

      <!-- Past solid line -->
      <path d="M 20 30
               C 50 32, 80 22, 110 26
               C 140 30, 170 18, 200 22
               C 230 26, 260 14, 290 18
               C 310 20, 320 22, 330 22"
            fill="none" stroke="#f5c249" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- FORECAST area fill (green tint) -->
      <path d="M 330 22
               C 360 18, 390 14, 420 12
               C 450 10, 480 8, 510 5
               C 540 3, 570 4, 600 2
               C 620 1, 630 2, 640 3
               L 640 42 L 330 42 Z"
            fill="url(#zda-forecast-fill)"/>

      <!-- Forecast dashed line -->
      <path d="M 330 22
               C 360 18, 390 14, 420 12
               C 450 10, 480 8, 510 5
               C 540 3, 570 4, 600 2
               C 620 1, 630 2, 640 3"
            fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.9"/>

      <!-- Today marker dot -->
      <circle cx="330" cy="22" r="3.5" fill="#fde68a"/>
      <circle cx="330" cy="22" r="3.5" fill="#fde68a" opacity="0.5">
        <animate attributeName="r" values="3.5;8;3.5" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>

      <!-- End of forecast dot -->
      <circle cx="640" cy="3" r="3" fill="#10b981"/>

      <!-- X-axis labels -->
      <g font-family="monospace" font-size="7" fill="#f5c249" opacity="0.45">
        <text x="20" y="54" text-anchor="middle">-7d</text>
        <text x="120" y="54" text-anchor="middle">-5d</text>
        <text x="220" y="54" text-anchor="middle">-2d</text>
        <text x="430" y="54" text-anchor="middle">+2d</text>
        <text x="530" y="54" text-anchor="middle">+5d</text>
        <text x="640" y="54" text-anchor="middle">+7d</text>
      </g>
    </g>
  </g>

  <!-- ============ BOTTOM STATUS BAR ============ -->
  <g transform="translate(70, 452)">
    <text x="0" y="3" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55">Last analysis: 2s ago · Auto-refresh enabled</text>
    <circle cx="525" cy="0" r="3" fill="#10b981"/>
    <text x="535" y="3" font-family="monospace" font-size="9" fill="#10b981" opacity="0.8" font-weight="bold">PREDICTIVE MODEL ACTIVE · OPTIMAL</text>
  </g>
</svg>
