<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="500" fill="#050e24"/>

  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="zdcm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f5c249" stroke-width="0.3" opacity="0.06"/>
    </pattern>

    <!-- Background glow -->
    <radialGradient id="zdcm-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#f5c249" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f5c249" stop-opacity="0"/>
    </radialGradient>

    <!-- Thumbnail content gradients (variety per media type) -->
    <linearGradient id="zdcm-thumb-img-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d9a82f" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="zdcm-thumb-img-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1630" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="zdcm-thumb-vid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3f82" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1630" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Storage bar gradient -->
    <linearGradient id="zdcm-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a82f"/>
      <stop offset="100%" stop-color="#f5c249"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#zdcm-grid)"/>
  <ellipse cx="400" cy="250" rx="380" ry="240" fill="url(#zdcm-glow)"/>

  <!-- ============ BROWSER FRAME ============ -->
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#0a1630" stroke="#f5c249" stroke-width="1" opacity="0.85"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>

  <!-- Header bar -->
  <rect x="40" y="40" width="720" height="38" rx="14" fill="#050e24" opacity="0.7"/>
  <rect x="40" y="76" width="720" height="0.5" fill="#f5c249" opacity="0.2"/>

  <!-- macOS-style window controls -->
  <circle cx="62" cy="59" r="5" fill="#ef4444"/>
  <circle cx="80" cy="59" r="5" fill="#f5c249"/>
  <circle cx="98" cy="59" r="5" fill="#10b981"/>

  <!-- Title -->
  <text x="400" y="63" font-family="sans-serif" font-size="11" font-weight="500" fill="#f5c249" text-anchor="middle" opacity="0.6" letter-spacing="1">ZD CONTENT MANAGEMENT</text>

  <!-- PUBLISHING badge top-right -->
  <g transform="translate(660, 50)">
    <rect width="80" height="20" rx="10" fill="#10b981" opacity="0.15"/>
    <rect width="80" height="20" rx="10" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
    <circle cx="14" cy="10" r="3" fill="#10b981"/>
    <circle cx="14" cy="10" r="3" fill="#10b981" opacity="0.5">
      <animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="46" y="14" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="middle">PUBLISHING</text>
  </g>

  <!-- ============ LEFT: MEDIA LIBRARY ============ -->
  <g transform="translate(70, 100)">
    <!-- Container -->
    <rect width="430" height="245" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="430" height="245" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Header -->
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f5c249" opacity="0.85">Media Library</text>
    <text x="20" y="42" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.45" letter-spacing="0.5">1,247 files · 84 GB</text>

    <!-- Tab pills -->
    <g transform="translate(280, 16)">
      <rect width="40" height="20" rx="4" fill="#f5c249" opacity="0.2"/>
      <text x="20" y="14" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c249" text-anchor="middle">ALL</text>
    </g>
    <g transform="translate(324, 16)">
      <rect width="40" height="20" rx="4" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="20" y="14" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.5" text-anchor="middle">IMG</text>
    </g>
    <g transform="translate(368, 16)">
      <rect width="40" height="20" rx="4" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="20" y="14" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.5" text-anchor="middle">VID</text>
    </g>

    <!-- Thumbnail grid (4 cols x 2 rows = 8 thumbs) -->
    <!-- Row 1 -->
    <!-- Thumb 1: Image (highlighted, gold gradient) -->
    <g transform="translate(20, 56)">
      <rect width="94" height="72" rx="6" fill="url(#zdcm-thumb-img-1)"/>
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="1.2" opacity="0.7"/>
      <!-- Image icon -->
      <g transform="translate(35, 24)" stroke="#fde68a" stroke-width="1.5" fill="none">
        <rect x="0" y="0" width="24" height="20" rx="2"/>
        <circle cx="7" cy="7" r="2" fill="#fde68a"/>
        <polyline points="2,17 9,11 14,15 22,8"/>
      </g>
      <!-- Filename -->
      <text x="6" y="66" font-family="monospace" font-size="7" fill="#fde68a" opacity="0.8">hero-1.jpg</text>
      <!-- Active badge -->
      <circle cx="86" cy="8" r="3" fill="#10b981"/>
    </g>

    <!-- Thumb 2: Video -->
    <g transform="translate(122, 56)">
      <rect width="94" height="72" rx="6" fill="url(#zdcm-thumb-vid)"/>
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>
      <!-- Play triangle -->
      <circle cx="47" cy="34" r="14" fill="#f5c249" opacity="0.85"/>
      <polygon points="42,28 42,40 54,34" fill="#050e24"/>
      <text x="6" y="66" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.6">promo.mp4</text>
      <text x="68" y="10" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.6">0:42</text>
    </g>

    <!-- Thumb 3: Image (greenish gradient) -->
    <g transform="translate(224, 56)">
      <rect width="94" height="72" rx="6" fill="url(#zdcm-thumb-img-2)"/>
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>
      <!-- Abstract landscape -->
      <path d="M 6 60 L 30 38 L 50 50 L 70 32 L 88 48 L 88 66 L 6 66 Z" fill="#f5c249" opacity="0.3"/>
      <circle cx="70" cy="22" r="6" fill="#f5c249" opacity="0.5"/>
      <text x="6" y="66" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.6">scene.png</text>
    </g>

    <!-- Thumb 4: Document -->
    <g transform="translate(326, 56)">
      <rect width="94" height="72" rx="6" fill="#0a1630" opacity="0.6"/>
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>
      <!-- Doc icon -->
      <g transform="translate(38, 18)" stroke="#f5c249" stroke-width="1.4" fill="none" opacity="0.7">
        <path d="M 0 0 L 14 0 L 20 6 L 20 28 L 0 28 Z"/>
        <line x1="4" y1="12" x2="16" y2="12"/>
        <line x1="4" y1="17" x2="16" y2="17"/>
        <line x1="4" y1="22" x2="12" y2="22"/>
      </g>
      <text x="6" y="66" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.6">brief.pdf</text>
    </g>

    <!-- Row 2 -->
    <!-- Thumb 5: Video -->
    <g transform="translate(20, 138)">
      <rect width="94" height="72" rx="6" fill="url(#zdcm-thumb-vid)"/>
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>
      <circle cx="47" cy="34" r="14" fill="#f5c249" opacity="0.85"/>
      <polygon points="42,28 42,40 54,34" fill="#050e24"/>
      <text x="6" y="66" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.6">launch.mp4</text>
      <text x="68" y="10" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.6">1:24</text>
    </g>

    <!-- Thumb 6: Image -->
    <g transform="translate(122, 138)">
      <rect width="94" height="72" rx="6" fill="url(#zdcm-thumb-img-2)"/>
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>
      <!-- Abstract pattern -->
      <circle cx="30" cy="30" r="14" fill="#f5c249" opacity="0.35"/>
      <circle cx="55" cy="45" r="10" fill="#f5c249" opacity="0.25"/>
      <text x="6" y="66" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.6">brand.png</text>
    </g>

    <!-- Thumb 7: Image (gold) -->
    <g transform="translate(224, 138)">
      <rect width="94" height="72" rx="6" fill="url(#zdcm-thumb-img-1)"/>
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>
      <!-- Sun + horizon -->
      <circle cx="62" cy="22" r="8" fill="#fde68a" opacity="0.7"/>
      <path d="M 6 50 Q 30 42 50 48 T 88 50 L 88 66 L 6 66 Z" fill="#d9a82f" opacity="0.3"/>
      <text x="6" y="66" font-family="monospace" font-size="7" fill="#fde68a" opacity="0.7">sunset.jpg</text>
    </g>

    <!-- Thumb 8: "+ more" placeholder -->
    <g transform="translate(326, 138)">
      <rect width="94" height="72" rx="6" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 3"/>
      <text x="47" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f5c249" opacity="0.5" text-anchor="middle">+</text>
      <text x="47" y="50" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" text-anchor="middle">1,239</text>
      <text x="47" y="62" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.4" text-anchor="middle">more</text>
    </g>
  </g>

  <!-- ============ RIGHT TOP: DISTRIBUTION STATS ============ -->
  <g transform="translate(520, 100)">
    <rect width="210" height="115" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="210" height="115" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5c249" opacity="0.85">Distribution</text>

    <!-- 3 stats row -->
    <g transform="translate(16, 38)">
      <!-- Screens -->
      <g>
        <text font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="0.5">SCREENS</text>
        <text y="22" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f5c249">247</text>
      </g>
      <!-- Live -->
      <g transform="translate(64, 0)">
        <text font-family="monospace" font-size="8" fill="#10b981" opacity="0.6" letter-spacing="0.5">LIVE</text>
        <text y="22" font-family="sans-serif" font-size="20" font-weight="bold" fill="#10b981">12</text>
      </g>
      <!-- Queued -->
      <g transform="translate(124, 0)">
        <text font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="0.5">QUEUED</text>
        <text y="22" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f5c249" opacity="0.85">48</text>
      </g>
    </g>

    <!-- Bandwidth meter -->
    <g transform="translate(16, 80)">
      <text font-family="monospace" font-size="8" fill="#f5c249" opacity="0.55">Bandwidth</text>
      <text x="178" y="0" font-family="monospace" font-size="8" font-weight="bold" fill="#f5c249" text-anchor="end">68%</text>
      <rect x="0" y="6" width="178" height="5" rx="2.5" fill="#f5c249" opacity="0.1"/>
      <rect x="0" y="6" width="121" height="5" rx="2.5" fill="url(#zdcm-bar)"/>
    </g>
  </g>

  <!-- ============ RIGHT BOTTOM: NEXT SCHEDULED ============ -->
  <g transform="translate(520, 230)">
    <rect width="210" height="115" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="210" height="115" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5c249" opacity="0.85">Next Scheduled</text>
    <text x="178" y="22" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.45" text-anchor="end" letter-spacing="0.5">TODAY</text>

    <!-- Schedule item 1 (active/live - highlighted) -->
    <g transform="translate(16, 34)">
      <rect width="178" height="22" rx="4" fill="#10b981" opacity="0.1"/>
      <rect width="178" height="22" rx="4" fill="none" stroke="#10b981" stroke-width="0.6" opacity="0.4"/>
      <rect x="4" y="4" width="3" height="14" rx="1.5" fill="#10b981"/>
      <text x="13" y="14" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.9">Promo Spring Sale</text>
      <text x="172" y="14" font-family="monospace" font-size="8" font-weight="bold" fill="#10b981" text-anchor="end">9:00 AM</text>
    </g>

    <!-- Schedule item 2 -->
    <g transform="translate(16, 60)">
      <rect width="178" height="22" rx="4" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.25"/>
      <rect x="4" y="4" width="3" height="14" rx="1.5" fill="#f5c249" opacity="0.5"/>
      <text x="13" y="14" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.7">Brand Awareness</text>
      <text x="172" y="14" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" text-anchor="end">12:00 PM</text>
    </g>

    <!-- Schedule item 3 -->
    <g transform="translate(16, 86)">
      <rect width="178" height="22" rx="4" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.25"/>
      <rect x="4" y="4" width="3" height="14" rx="1.5" fill="#f5c249" opacity="0.4"/>
      <text x="13" y="14" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.7">Product Launch</text>
      <text x="172" y="14" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" text-anchor="end">3:00 PM</text>
    </g>
  </g>

  <!-- ============ STORAGE QUOTA BAR (bottom left) ============ -->
  <g transform="translate(70, 360)">
    <rect width="430" height="60" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="430" height="60" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Header -->
    <text x="16" y="20" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55" letter-spacing="1">STORAGE QUOTA</text>
    <text x="414" y="20" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.85" text-anchor="end">54.2 GB / 80 GB</text>

    <!-- Bar -->
    <rect x="16" y="28" width="398" height="8" rx="4" fill="#f5c249" opacity="0.1"/>
    <rect x="16" y="28" width="270" height="8" rx="4" fill="url(#zdcm-bar)"/>

    <!-- Label below -->
    <text x="16" y="50" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.45">68% used · 25.8 GB available</text>
    <circle cx="408" cy="48" r="3" fill="#10b981"/>
    <text x="402" y="51" font-family="monospace" font-size="8" font-weight="bold" fill="#10b981" text-anchor="end">healthy</text>
  </g>

  <!-- ============ BOTTOM STATUS BAR ============ -->
  <g transform="translate(70, 442)">
    <text x="0" y="3" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55">Last sync: 2s ago · CDN active</text>
    <circle cx="555" cy="0" r="3" fill="#10b981"/>
    <text x="565" y="3" font-family="monospace" font-size="9" fill="#10b981" opacity="0.8" font-weight="bold">1,247 FILES INDEXED · ALL OPERATIONAL</text>
  </g>
</svg>
