<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="500" fill="#050e24"/>

  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="zdr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f5c249" stroke-width="0.3" opacity="0.06"/>
    </pattern>

    <!-- Background glow -->
    <radialGradient id="zdr-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#f5c249" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f5c249" stop-opacity="0"/>
    </radialGradient>

    <!-- Chart area gradient -->
    <linearGradient id="zdr-chart-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5c249" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#zdr-grid)"/>
  <ellipse cx="400" cy="250" rx="380" ry="240" fill="url(#zdr-glow)"/>

  <!-- ============ BROWSER FRAME ============ -->
  <!-- Outer container -->
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#0a1630" stroke="#f5c249" stroke-width="1" opacity="0.85"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>

  <!-- Header bar -->
  <rect x="40" y="40" width="720" height="38" rx="14" fill="#050e24" opacity="0.7"/>
  <rect x="40" y="76" width="720" height="0.5" fill="#f5c249" opacity="0.2"/>

  <!-- macOS-style window controls -->
  <circle cx="62" cy="59" r="5" fill="#ef4444"/>
  <circle cx="80" cy="59" r="5" fill="#f5c249"/>
  <circle cx="98" cy="59" r="5" fill="#10b981"/>

  <!-- Title bar text -->
  <text x="400" y="63" font-family="sans-serif" font-size="11" font-weight="500" fill="#f5c249" text-anchor="middle" opacity="0.6" letter-spacing="1">ZD REMOTE · CONSOLE</text>

  <!-- LIVE indicator top-right -->
  <circle cx="720" cy="59" r="3" fill="#10b981"/>
  <circle cx="720" cy="59" r="3" fill="#10b981" opacity="0.5">
    <animate attributeName="r" values="3;8;3" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="732" y="63" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981">LIVE</text>

  <!-- ============ STATS CARDS ROW ============ -->
  <!-- Card 1: Devices -->
  <g transform="translate(70, 100)">
    <rect width="200" height="80" rx="10" fill="#f5c249" opacity="0.04"/>
    <rect width="200" height="80" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Icon -->
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#f5c249" opacity="0.15"/>
    <g transform="translate(24, 24)" stroke="#f5c249" stroke-width="1.5" fill="none">
      <rect x="0" y="2" width="16" height="11" rx="1.5"/>
      <line x1="4" y1="16" x2="12" y2="16"/>
      <line x1="8" y1="13" x2="8" y2="16"/>
    </g>

    <!-- Label -->
    <text x="60" y="29" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.5" letter-spacing="1">DEVICES</text>

    <!-- Value -->
    <text x="60" y="56" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5c249">247</text>

    <!-- Mini trend indicator -->
    <text x="120" y="56" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981">↑ 12</text>
  </g>

  <!-- Card 2: Uptime -->
  <g transform="translate(290, 100)">
    <rect width="200" height="80" rx="10" fill="#f5c249" opacity="0.04"/>
    <rect width="200" height="80" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <rect x="16" y="16" width="32" height="32" rx="6" fill="#10b981" opacity="0.2"/>
    <g transform="translate(24, 24)" stroke="#10b981" stroke-width="1.5" fill="none">
      <circle cx="8" cy="8" r="7"/>
      <polyline points="5,8 7,10 11,5"/>
    </g>

    <text x="60" y="29" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.5" letter-spacing="1">UPTIME</text>
    <text x="60" y="56" font-family="sans-serif" font-size="26" font-weight="bold" fill="#10b981">99.9%</text>
    <text x="145" y="56" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.5">7d avg</text>
  </g>

  <!-- Card 3: Latency -->
  <g transform="translate(510, 100)">
    <rect width="220" height="80" rx="10" fill="#f5c249" opacity="0.04"/>
    <rect width="220" height="80" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <rect x="16" y="16" width="32" height="32" rx="6" fill="#f5c249" opacity="0.15"/>
    <g transform="translate(24, 24)" stroke="#f5c249" stroke-width="1.5" fill="none">
      <circle cx="8" cy="8" r="6"/>
      <line x1="8" y1="8" x2="11" y2="6"/>
      <line x1="8" y1="8" x2="8" y2="3"/>
    </g>

    <text x="60" y="29" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.5" letter-spacing="1">LATENCY</text>
    <text x="60" y="56" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5c249">24<tspan font-size="14" opacity="0.6">ms</tspan></text>
    <text x="155" y="56" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981">↓ 3ms</text>
  </g>

  <!-- ============ CHART AREA ============ -->
  <g transform="translate(70, 200)">
    <!-- Container -->
    <rect width="430" height="225" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="430" height="225" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Header -->
    <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f5c249" opacity="0.85">Performance Trend</text>
    <text x="20" y="44" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.45" letter-spacing="0.5">Last 24 hours · ms</text>

    <!-- Tabs -->
    <g transform="translate(330, 18)">
      <rect width="36" height="20" rx="4" fill="#f5c249" opacity="0.2"/>
      <text x="18" y="14" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c249" text-anchor="middle">24H</text>
    </g>
    <g transform="translate(370, 18)">
      <rect width="36" height="20" rx="4" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="18" y="14" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.5" text-anchor="middle">7D</text>
    </g>

    <!-- Y-axis labels -->
    <g font-family="monospace" font-size="8" fill="#f5c249" opacity="0.35">
      <text x="14" y="78" text-anchor="end">50</text>
      <text x="14" y="118" text-anchor="end">30</text>
      <text x="14" y="158" text-anchor="end">15</text>
      <text x="14" y="198" text-anchor="end">0</text>
    </g>

    <!-- Grid lines -->
    <g stroke="#f5c249" stroke-width="0.3" opacity="0.15">
      <line x1="22" y1="75" x2="415" y2="75"/>
      <line x1="22" y1="115" x2="415" y2="115"/>
      <line x1="22" y1="155" x2="415" y2="155"/>
      <line x1="22" y1="195" x2="415" y2="195"/>
    </g>

    <!-- Chart area fill -->
    <path d="M 22 145
             C 50 130, 70 110, 90 120
             C 110 130, 130 90, 155 95
             C 180 100, 200 75, 225 85
             C 250 95, 270 110, 290 100
             C 310 90, 330 70, 355 80
             C 380 90, 400 85, 415 95
             L 415 195
             L 22 195 Z"
          fill="url(#zdr-chart-fill)"/>

    <!-- Chart line -->
    <path d="M 22 145
             C 50 130, 70 110, 90 120
             C 110 130, 130 90, 155 95
             C 180 100, 200 75, 225 85
             C 250 95, 270 110, 290 100
             C 310 90, 330 70, 355 80
             C 380 90, 400 85, 415 95"
          fill="none" stroke="#f5c249" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data point highlights -->
    <circle cx="155" cy="95" r="3" fill="#f5c249"/>
    <circle cx="225" cy="85" r="3" fill="#f5c249"/>
    <circle cx="355" cy="80" r="4" fill="#10b981"/>
    <circle cx="355" cy="80" r="7" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- X-axis labels -->
    <g font-family="monospace" font-size="8" fill="#f5c249" opacity="0.35">
      <text x="22" y="212" text-anchor="middle">00h</text>
      <text x="120" y="212" text-anchor="middle">06h</text>
      <text x="218" y="212" text-anchor="middle">12h</text>
      <text x="316" y="212" text-anchor="middle">18h</text>
      <text x="415" y="212" text-anchor="middle">24h</text>
    </g>
  </g>

  <!-- ============ RIGHT SIDEBAR: Active Sessions ============ -->
  <g transform="translate(520, 200)">
    <rect width="210" height="225" rx="10" fill="#f5c249" opacity="0.03"/>
    <rect width="210" height="225" rx="10" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.3"/>

    <!-- Header -->
    <text x="18" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f5c249" opacity="0.85">Active Sessions</text>
    <circle cx="180" cy="24" r="3" fill="#10b981"/>
    <text x="190" y="28" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="end">●</text>

    <!-- Session 1 -->
    <g transform="translate(18, 50)">
      <rect width="174" height="38" rx="6" fill="#f5c249" opacity="0.06"/>
      <rect width="174" height="38" rx="6" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <!-- Avatar -->
      <circle cx="16" cy="19" r="9" fill="#f5c249" opacity="0.25"/>
      <text x="16" y="22" font-family="sans-serif" font-size="8" font-weight="bold" fill="#f5c249" text-anchor="middle">EP</text>
      <!-- Text -->
      <text x="32" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.85">EP-247 · Production</text>
      <text x="32" y="28" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.45">12ms · Encrypted</text>
      <!-- Status -->
      <circle cx="164" cy="19" r="2.5" fill="#10b981"/>
    </g>

    <!-- Session 2 -->
    <g transform="translate(18, 96)">
      <rect width="174" height="38" rx="6" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.25"/>
      <circle cx="16" cy="19" r="9" fill="#f5c249" opacity="0.15"/>
      <text x="16" y="22" font-family="sans-serif" font-size="8" font-weight="bold" fill="#f5c249" opacity="0.7" text-anchor="middle">EP</text>
      <text x="32" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.7">EP-184 · Staging</text>
      <text x="32" y="28" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.4">8ms · Encrypted</text>
      <circle cx="164" cy="19" r="2.5" fill="#10b981" opacity="0.8"/>
    </g>

    <!-- Session 3 -->
    <g transform="translate(18, 142)">
      <rect width="174" height="38" rx="6" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.25"/>
      <circle cx="16" cy="19" r="9" fill="#f5c249" opacity="0.15"/>
      <text x="16" y="22" font-family="sans-serif" font-size="8" font-weight="bold" fill="#f5c249" opacity="0.7" text-anchor="middle">EP</text>
      <text x="32" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f5c249" opacity="0.7">EP-091 · Dev</text>
      <text x="32" y="28" font-family="monospace" font-size="7" fill="#f5c249" opacity="0.4">18ms · Encrypted</text>
      <circle cx="164" cy="19" r="2.5" fill="#f5c249" opacity="0.5"/>
    </g>

    <!-- "+ more" footer -->
    <g transform="translate(18, 192)">
      <rect width="174" height="18" rx="4" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.2"/>
      <text x="87" y="13" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" text-anchor="middle">+ 12 more active</text>
    </g>
  </g>

  <!-- ============ BOTTOM STATUS BAR ============ -->
  <g transform="translate(70, 435)">
    <circle cx="6" cy="8" r="3" fill="#10b981"/>
    <text x="16" y="11" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55">Connected · All systems operational</text>
    <text x="660" y="11" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.45" text-anchor="end">AES-256 · End-to-end encrypted</text>
  </g>
</svg>
