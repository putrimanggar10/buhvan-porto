<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="500" fill="#050e24"/>

  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="zdc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f5c249" stroke-width="0.3" opacity="0.06"/>
    </pattern>

    <!-- Background glow -->
    <radialGradient id="zdc-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f5c249" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f5c249" stop-opacity="0"/>
    </radialGradient>

    <!-- Hub/Device gradient -->
    <radialGradient id="zdc-hub" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f5c249"/>
      <stop offset="100%" stop-color="#d9a82f"/>
    </radialGradient>

    <!-- Hub glow filter -->
    <filter id="zdc-hub-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Progress bar gradient -->
    <linearGradient id="zdc-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a82f"/>
      <stop offset="100%" stop-color="#f5c249"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#zdc-grid)"/>
  <ellipse cx="400" cy="250" rx="380" ry="240" fill="url(#zdc-glow)"/>

  <!-- ============ BROWSER FRAME ============ -->
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#0a1630" stroke="#f5c249" stroke-width="1" opacity="0.85"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>

  <!-- Header bar -->
  <rect x="40" y="40" width="720" height="38" rx="14" fill="#050e24" opacity="0.7"/>
  <rect x="40" y="76" width="720" height="0.5" fill="#f5c249" opacity="0.2"/>

  <!-- macOS-style window controls -->
  <circle cx="62" cy="59" r="5" fill="#ef4444"/>
  <circle cx="80" cy="59" r="5" fill="#f5c249"/>
  <circle cx="98" cy="59" r="5" fill="#10b981"/>

  <!-- Title -->
  <text x="400" y="63" font-family="sans-serif" font-size="11" font-weight="500" fill="#f5c249" text-anchor="middle" opacity="0.6" letter-spacing="1">REMOTE CONNECTION STATUS</text>

  <!-- ENCRYPTED badge top-right -->
  <g transform="translate(660, 50)">
    <rect width="80" height="20" rx="10" fill="#10b981" opacity="0.15"/>
    <rect width="80" height="20" rx="10" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
    <!-- Lock icon -->
    <g transform="translate(8, 5)" stroke="#10b981" stroke-width="1.2" fill="none">
      <rect x="0" y="3" width="9" height="7" rx="1"/>
      <path d="M 1.5 3 Q 1.5 0 4.5 0 Q 7.5 0 7.5 3"/>
    </g>
    <text x="44" y="14" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="middle">ENCRYPTED</text>
  </g>

  <!-- ============ CENTRAL CONNECTION VISUALIZATION ============ -->

  <!-- Connection line (dashed) -->
  <line x1="220" y1="170" x2="580" y2="170" stroke="#f5c249" stroke-width="1" opacity="0.3" stroke-dasharray="4 6"/>

  <!-- Animated transmission waves (3 concentric arcs flowing from hub) -->
  <g fill="none" stroke="#f5c249" stroke-width="1.5">
    <!-- Wave 1 -->
    <circle cx="200" cy="170" r="40" opacity="0">
      <animate attributeName="r" values="40;200;360" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Wave 2 (delayed) -->
    <circle cx="200" cy="170" r="40" opacity="0">
      <animate attributeName="r" values="40;200;360" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <!-- Wave 3 (delayed more) -->
    <circle cx="200" cy="170" r="40" opacity="0">
      <animate attributeName="r" values="40;200;360" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Data packet animation (dot moving along line) -->
  <circle r="3" fill="#10b981">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 220 170 L 580 170"/>
  </circle>
  <circle r="6" fill="#10b981" opacity="0.5">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 220 170 L 580 170"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- HUB (left) -->
  <g transform="translate(200, 170)">
    <!-- Outer halo -->
    <circle r="50" fill="#f5c249" opacity="0.08"/>
    <circle r="42" fill="#f5c249" opacity="0.15"/>

    <!-- Main hub circle -->
    <circle r="34" fill="url(#zdc-hub)" filter="url(#zdc-hub-glow)"/>

    <!-- Hub border ring -->
    <circle r="34" fill="none" stroke="#fde68a" stroke-width="1" opacity="0.5"/>

    <!-- Hub icon — broadcast tower stylized -->
    <g stroke="#050e24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Center antenna -->
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <!-- Wave arcs -->
      <path d="M -6 -3 Q -3 -8 0 -12 Q 3 -8 6 -3"/>
      <path d="M -11 -2 Q -6 -10 0 -16 Q 6 -10 11 -2"/>
    </g>

    <!-- Label -->
    <text x="0" y="56" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5c249" text-anchor="middle" opacity="0.85">ZD HUB</text>
    <text x="0" y="70" font-family="monospace" font-size="8" fill="#f5c249" text-anchor="middle" opacity="0.45">Control center</text>
  </g>

  <!-- ENDPOINT (right) — Device cluster -->
  <g transform="translate(580, 170)">
    <!-- Outer halo -->
    <circle r="50" fill="#f5c249" opacity="0.06"/>
    <circle r="42" fill="#f5c249" opacity="0.1"/>

    <!-- Main circle -->
    <circle r="34" fill="#0a1630" stroke="#f5c249" stroke-width="1.5" opacity="0.95"/>
    <circle r="34" fill="none" stroke="#f5c249" stroke-width="0.6" opacity="0.4"/>

    <!-- Device cluster icon — 4 small devices in grid -->
    <g stroke="#f5c249" stroke-width="1.2" fill="none" opacity="0.85">
      <!-- Top-left device -->
      <rect x="-13" y="-13" width="10" height="8" rx="1"/>
      <line x1="-11" y1="-3" x2="-5" y2="-3" opacity="0.6"/>
      <!-- Top-right device -->
      <rect x="3" y="-13" width="10" height="8" rx="1"/>
      <line x1="5" y1="-3" x2="11" y2="-3" opacity="0.6"/>
      <!-- Bottom-left device -->
      <rect x="-13" y="3" width="10" height="8" rx="1"/>
      <line x1="-11" y1="13" x2="-5" y2="13" opacity="0.6"/>
      <!-- Bottom-right device -->
      <rect x="3" y="3" width="10" height="8" rx="1"/>
      <line x1="5" y1="13" x2="11" y2="13" opacity="0.6"/>
    </g>

    <!-- Active status dot -->
    <circle cx="22" cy="-22" r="4" fill="#10b981"/>
    <circle cx="22" cy="-22" r="4" fill="#10b981" opacity="0.5">
      <animate attributeName="r" values="4;9;4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Label -->
    <text x="0" y="56" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5c249" text-anchor="middle" opacity="0.85">DEVICE FLEET</text>
    <text x="0" y="70" font-family="monospace" font-size="8" fill="#f5c249" text-anchor="middle" opacity="0.45">247 endpoints</text>
  </g>

  <!-- Connection metadata above line -->
  <g transform="translate(400, 150)" text-anchor="middle">
    <text font-family="monospace" font-size="9" fill="#10b981" opacity="0.85" font-weight="bold">⚡ TRANSMITTING</text>
  </g>
  <g transform="translate(400, 195)" text-anchor="middle">
    <text font-family="monospace" font-size="8" fill="#f5c249" opacity="0.45">AES-256 · 12ms</text>
  </g>

  <!-- ============ STATS GRID (4 cols) ============ -->
  <g transform="translate(70, 270)">
    <!-- Stat 1: Encryption -->
    <g>
      <rect width="160" height="56" rx="8" fill="#f5c249" opacity="0.04"/>
      <rect width="160" height="56" rx="8" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="14" y="20" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="1">ENCRYPTION</text>
      <text x="14" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f5c249">AES-256</text>
      <circle cx="146" cy="36" r="3" fill="#10b981"/>
    </g>

    <!-- Stat 2: Latency -->
    <g transform="translate(170, 0)">
      <rect width="160" height="56" rx="8" fill="#f5c249" opacity="0.04"/>
      <rect width="160" height="56" rx="8" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="14" y="20" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="1">LATENCY</text>
      <text x="14" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f5c249">12<tspan font-size="10" opacity="0.6">ms</tspan></text>
      <text x="146" y="40" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="end">↓ low</text>
    </g>

    <!-- Stat 3: Connections -->
    <g transform="translate(340, 0)">
      <rect width="160" height="56" rx="8" fill="#f5c249" opacity="0.04"/>
      <rect width="160" height="56" rx="8" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="14" y="20" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="1">CONNECTIONS</text>
      <text x="14" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f5c249">247</text>
      <text x="146" y="40" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="end">active</text>
    </g>

    <!-- Stat 4: Bandwidth -->
    <g transform="translate(510, 0)">
      <rect width="180" height="56" rx="8" fill="#f5c249" opacity="0.04"/>
      <rect width="180" height="56" rx="8" fill="none" stroke="#f5c249" stroke-width="0.5" opacity="0.3"/>
      <text x="14" y="20" font-family="monospace" font-size="8" fill="#f5c249" opacity="0.5" letter-spacing="1">BANDWIDTH</text>
      <text x="14" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f5c249">1.2<tspan font-size="10" opacity="0.6">Gbps</tspan></text>
      <text x="166" y="40" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="end">stable</text>
    </g>
  </g>

  <!-- ============ RESOURCE METERS ============ -->
  <g transform="translate(70, 350)">
    <text x="0" y="-2" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.5" letter-spacing="1">SYSTEM RESOURCES</text>

    <!-- CPU -->
    <g transform="translate(0, 14)">
      <text x="0" y="9" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.7">CPU</text>
      <text x="40" y="9" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55">Processing</text>
      <text x="690" y="9" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c249" text-anchor="end">62%</text>
      <!-- Bar track -->
      <rect x="0" y="14" width="660" height="6" rx="3" fill="#f5c249" opacity="0.1"/>
      <!-- Bar fill -->
      <rect x="0" y="14" width="409" height="6" rx="3" fill="url(#zdc-bar)"/>
    </g>

    <!-- Memory -->
    <g transform="translate(0, 44)">
      <text x="0" y="9" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.7">MEM</text>
      <text x="40" y="9" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55">Memory usage</text>
      <text x="690" y="9" font-family="monospace" font-size="9" font-weight="bold" fill="#f5c249" text-anchor="end">41%</text>
      <rect x="0" y="14" width="660" height="6" rx="3" fill="#f5c249" opacity="0.1"/>
      <rect x="0" y="14" width="270" height="6" rx="3" fill="url(#zdc-bar)"/>
    </g>

    <!-- Network -->
    <g transform="translate(0, 74)">
      <text x="0" y="9" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.7">NET</text>
      <text x="40" y="9" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55">Network throughput</text>
      <text x="690" y="9" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="end">23%</text>
      <rect x="0" y="14" width="660" height="6" rx="3" fill="#f5c249" opacity="0.1"/>
      <rect x="0" y="14" width="152" height="6" rx="3" fill="#10b981"/>
    </g>
  </g>

  <!-- ============ BOTTOM STATUS BAR ============ -->
  <g transform="translate(70, 442)">
    <text x="0" y="3" font-family="monospace" font-size="9" fill="#f5c249" opacity="0.55">Last sync: 2s ago · Auto-refresh enabled</text>
    <circle cx="615" cy="0" r="3" fill="#10b981"/>
    <text x="625" y="3" font-family="monospace" font-size="9" fill="#10b981" opacity="0.8" font-weight="bold">ALL SYSTEMS OPERATIONAL</text>
  </g>
</svg>
