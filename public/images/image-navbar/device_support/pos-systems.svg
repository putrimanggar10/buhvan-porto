<svg width="600" height="340" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- ============ BACKGROUND ============ -->
  <rect width="600" height="340" fill="#050e24"/>

  <defs>
    <pattern id="grid-pos" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f5c249" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <radialGradient id="glow-pos" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c249" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f5c249" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" fill="url(#grid-pos)"/>

  <!-- Center glow -->
  <circle cx="300" cy="170" r="160" fill="url(#glow-pos)"/>

  <!-- ============ CENTER TEXT COMPOSITION ============ -->

  <!-- Title (big, bold, gold, centered) -->
  <text x="300" y="158" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f5c249" text-anchor="middle" letter-spacing="-0.5">POS &amp; Transaction</text>

  <!-- Underline divider (thin gold line, centered) -->
  <line x1="240" y1="180" x2="360" y2="180" stroke="#f5c249" stroke-width="1" opacity="0.5"/>

  <!-- Tagline (small, uppercase, tracking, muted gold) -->
  <text x="300" y="208" font-family="sans-serif" font-size="13" font-weight="500" fill="#f5c249" text-anchor="middle" letter-spacing="4" opacity="0.7">RETAIL BACKBONE</text>
</svg>
